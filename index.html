    <style>
        /* =========================================
           TEMA WARNA & TIPOGRAFI CERIA
           ========================================= */
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #FDF6E7; /* Latar krem lembut sesuai referensi */
            color: #4A3B32;
            overflow-x: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .font-kids {
            font-family: 'Fredoka', sans-serif;
        }

        /* Sembunyikan scrollbar horizontal */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Kartu Buku Vertikal Tinggi (Tall Rounded Cards) */
        .module-card {
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.35s ease;
            box-shadow: 0 12px 24px -6px rgba(74, 59, 50, 0.14);
        }

        @media (hover: hover) {
            .module-card:hover {
                transform: translateY(-10px) scale(1.02);
                box-shadow: 0 20px 32px -8px rgba(74, 59, 50, 0.22);
            }
        }

        .module-card:active {
            transform: scale(0.97);
        }

        /* =========================================
           OVERLAY BUKU TERBUKA 3D DI ATAS SEMUA BUKU
           ========================================= */
        .overlay-backdrop {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }
        .overlay-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .book-stage {
            perspective: 2000px;
            transform: scale(0.85) translateY(30px);
            transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .overlay-backdrop.active .book-stage {
            transform: scale(1) translateY(0);
        }

        /* Struktur Buku Terbuka 2 Halaman */
        .open-book-wrapper {
            position: relative;
            transform-style: preserve-3d;
        }

        /* Sampul Kiri yang Terbuka ke Samping */
        .book-left-flap {
            transform-origin: right center;
            transition: transform 0.65s cubic-bezier(0.34, 1.3, 0.64, 1);
        }

        /* Lipatan Tengah Buku (Gutter Shadow) */
        .book-gutter {
            background: linear-gradient(to right, rgba(0,0,0,0.02) 0%, rgba(0,0,0,0.12) 50%, rgba(0,0,0,0.03) 100%);
        }

        /* Efek Tumpukan Kertas di Pinggir Buku */
        .paper-stack-right {
            box-shadow: 
                4px 0 0 #f1f5f9,
                5px 0 0 #cbd5e1,
                9px 0 0 #f8fafc,
                10px 0 0 #cbd5e1,
                0 20px 40px rgba(74, 59, 50, 0.25);
        }
        .paper-stack-left {
            box-shadow: 
                -4px 0 0 #f1f5f9,
                -5px 0 0 #cbd5e1,
                -9px 0 0 #f8fafc,
                -10px 0 0 #cbd5e1,
                0 20px 40px rgba(74, 59, 50, 0.25);
        }

        /* Animasi Stagger untuk Item Daftar Isi */
        @keyframes popIn {
            0% { opacity: 0; transform: translateY(10px) scale(0.97); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .toc-animate {
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
        }
    </style>
</head>

                            <i data-lucide="book-open" class="w-3.5 h-3.5"></i>

                carousel.appendChild(card);

                // Dot Indikator untuk Mobile (index + 1 karena slot 0 adalah kartu greeting)

                dot.ariaLabel = `Geser ke ${book.title}`;
                dot.className = 'h-2.5 w-2.5 rounded-full bg-[#D5C7B8] transition-all duration-300';

        // ==========================================
        // BUKA OVERLAY BUKU DI ATAS SEMUA BUKU
        // ==========================================
        function openBookOverlay(index) {
            const book = books[index];
            const overlay = document.getElementById('bookOverlay');
            const container = document.getElementById('openBookContent');

            // Render Daftar Isi
            const tocItemsHTML = book.toc.map((item, idx) => `
                <a href="${item.file}" 
                   style="animation-delay: ${0.12 + idx * 0.08}s"
                   class="toc-animate group flex items-center justify-between p-3.5 rounded-2xl border-2 transition-all duration-200 ${
                       item.primary 
                       ? `${book.accentBtn} border-transparent text-white shadow-md hover:shadow-lg hover:-translate-y-0.5` 
                       : 'bg-white hover:bg-amber-50/80 border-amber-200/80 text-[#4A3B32]'
                   }">
                    <div class="flex items-center gap-3">
                        <span class="w-8 h-8 rounded-xl flex items-center justify-center font-kids font-bold text-xs ${
                            item.primary ? 'bg-white/20 text-white' : 'bg-[#FDF6E7] text-[#8C7A6B]'
                        }">
                            0${idx + 1}
                        </span>
                        <div>
                            <span class="text-[10px] font-extrabold uppercase tracking-wider block ${
                                item.primary ? 'text-white/80' : 'text-[#9C897B]'
                            }">
                                ${item.code}
                            </span>
                            <span class="font-bold text-sm sm:text-[15px] leading-snug block">
                                ${item.name}
                            </span>
                        </div>
                    </div>
                    <div class="w-8 h-8 rounded-full flex items-center justify-center transition-transform group-hover:translate-x-1 ${
                        item.primary ? 'bg-white text-[#4A3B32]' : 'bg-amber-100 text-[#4A3B32]'
                    }">
                        <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </div>
                </a>
            `).join('');

            // Susun Buku Terbuka 2 Halaman (Kiri: Sampul Dalam & Ilustrasi, Kanan: Daftar Isi & Link HTML)
            container.innerHTML = `
                <!-- HALAMAN KIRI (Sampul Dalam Berwarna) -->
                <div class="paper-stack-left rounded-t-3xl md:rounded-l-3xl md:rounded-tr-none p-6 sm:p-8 text-white flex flex-col justify-between relative overflow-hidden" style="background-color: ${book.bgColor}">
                    <!-- Efek Lipatan Tengah di Sisi Kanan Halaman Kiri -->
                    <div class="hidden md:block absolute inset-y-0 right-0 w-8 book-gutter pointer-events-none"></div>

                    <div>
                        <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-white text-xs font-kids font-bold uppercase tracking-wider shadow-sm" style="color: ${book.badgeText}">
                            <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
                            <span>${book.stage} • ${book.subtitle}</span>
                        </div>
                        <h2 class="font-kids text-3xl sm:text-4xl font-bold mt-4 drop-shadow-sm">
                            ${book.title}
                        </h2>
                        <p class="text-sm text-white/95 mt-2.5 leading-relaxed font-medium">
                            ${book.description}
                        </p>
                    </div>

                    <!-- Ilustrasi di Halaman Kiri -->
                    <div class="w-44 h-36 mx-auto my-4 drop-shadow-md">
                        ${book.illustration}
                    </div>

                    <!-- Info File Target -->
                    <div class="bg-black/15 backdrop-blur-sm rounded-2xl px-4 py-2.5 flex items-center justify-between text-xs">
                        <span class="text-white/80 font-medium">File Tujuan:</span>
                        <code class="font-mono font-bold text-white bg-white/15 px-2 py-0.5 rounded-md">${book.file}</code>
                    </div>
                </div>

                <!-- HALAMAN KANAN (Kertas Putih Krem - Daftar Isi) -->
                <div class="paper-stack-right bg-[#FFFDF9] rounded-b-3xl md:rounded-r-3xl md:rounded-bl-none p-6 sm:p-8 flex flex-col justify-between relative">
                    <!-- Efek Lipatan Tengah di Sisi Kiri Halaman Kanan -->
                    <div class="hidden md:block absolute inset-y-0 left-0 w-6 book-gutter pointer-events-none"></div>

                    <div>
                        <div class="flex items-center justify-between border-b-2 border-dashed border-amber-200 pb-3 mb-4">
                            <div>
                                <span class="text-[11px] font-extrabold uppercase tracking-widest text-[#9C897B]">Navigasi Halaman</span>
                                <h3 class="font-kids text-2xl font-bold text-[#4A3B32]">Daftar Isi Buku</h3>
                            </div>
                            <span class="w-10 h-10 rounded-2xl bg-[#FDF6E7] border border-amber-200 flex items-center justify-center text-[#EE5253]">
                                <i data-lucide="list-ordered" class="w-5 h-5"></i>
                            </span>
                        </div>

                        <!-- Daftar Bab & Link Langsung -->
                        <div class="space-y-3">
                            ${tocItemsHTML}
                        </div>
                    </div>

                    <!-- Footer Halaman Kanan -->
                    <div class="mt-6 pt-3 border-t border-amber-100 flex items-center justify-between text-xs text-[#8C7A6B]">
                        <span>Klik daftar isi untuk membuka file</span>
                        <button onclick="closeBookOverlay()" class="font-bold text-[#EE5253] hover:underline">
                            Tutup Buku

                </div>
            `;

            lucide.createIcons();
            overlay.classList.add('active');
        }

        function closeBookOverlay(event) {
            if (event && event.target !== event.currentTarget) return;
            document.getElementById('bookOverlay').classList.remove('active');
        }

        // ==========================================
        // MODAL AKSES CEPAT KE 4 LINK HTML
        // ==========================================
        function renderQuickLinks() {
            const list = document.getElementById('quickLinksList');
            list.innerHTML = books.map(book => `
                <a href="${book.file}" class="flex items-center justify-between p-3 rounded-2xl bg-white hover:bg-amber-50 border-2 border-amber-200/70 transition group">
                    <div class="flex items-center gap-3">
                        <span class="w-9 h-9 rounded-xl flex items-center justify-center text-white font-kids font-bold text-sm shadow-sm" style="background-color: ${book.bgColor}">
                            ${book.title.substring(0, 2).toUpperCase()}
                        </span>
                        <div>
                            <div class="font-bold text-sm text-[#4A3B32]">${book.title}</div>
                            <div class="text-[11px] font-mono text-[#8C7A6B]">${book.file}</div>
                        </div>
                    </div>
                    <i data-lucide="external-link" class="w-4 h-4 text-[#9C897B] group-hover:text-[#EE5253] transition"></i>
                </a>
            `).join('');
        }

        function openAllLinksModal() {
            document.getElementById('quickLinksModal').classList.add('active');
        }

        function closeAllLinksModal(event) {
            if (event && event.target !== event.currentTarget) return;
            document.getElementById('quickLinksModal').classList.remove('active');
        }

        // ==========================================
        // DUKUNGAN SWIPE & DRAG MOUSE UNTUK CAROUSEL
        // ==========================================
        carousel.addEventListener('scroll', () => {
            const center = carousel.scrollLeft + carousel.offsetWidth / 2;
            const cards = Array.from(carousel.children);
            let closest = 0;
            let minDist = Infinity;

            cards.forEach((card, idx) => {
                const cardCenter = card.offsetLeft + card.offsetWidth / 2;
                const dist = Math.abs(center - cardCenter);
                if (dist < minDist) {
                    minDist = dist;
                    closest = idx;
                }
            });

            if (closest !== currentSlide) {
                currentSlide = closest;
                Array.from(swipeDots.children).forEach((dot, idx) => {
                    dot.className = idx === currentSlide 
                        ? 'h-2.5 w-7 rounded-full bg-[#EE5253] transition-all duration-300' 
                        : 'h-2.5 w-2.5 rounded-full bg-[#D5C7B8] transition-all duration-300';
                });
            }
        });

        // Drag dengan mouse di desktop
        let isDragging = false;
        let startX = 0;
        let scrollStart = 0;

        carousel.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.pageX - carousel.offsetLeft;
            scrollStart = carousel.scrollLeft;
        });
        carousel.addEventListener('mouseleave', () => { isDragging = false; });
        carousel.addEventListener('mouseup', () => { isDragging = false; });
        carousel.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            e.preventDefault();
            const x = e.pageX - carousel.offsetLeft;
            carousel.scrollLeft = scrollStart - (x - startX) * 1.4;
        });

        // Tutup overlay dengan tombol ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeBookOverlay();
                closeAllLinksModal();
            }
        });

        // ==========================================
        // KONFIGURASI PWA (MANIFEST, ICON & OFFLINE SERVICE WORKER)
        // ==========================================
        let deferredPrompt = null;

        function setupPWA() {
            try {
                // 1. Buat Ikon Aplikasi SVG Ceria & Konversi ke Data URL
                const appIconSvg = `
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                        <rect width="512" height="512" rx="115" fill="#FFD426"/>
                        <circle cx="256" cy="266" r="155" fill="#F59E0B"/>
                        <circle cx="256" cy="266" r="120" fill="#FDE68A"/>
                        <circle cx="212" cy="245" r="18" fill="#4A3B32"/>
                        <circle cx="300" cy="245" r="18" fill="#4A3B32"/>
                        <ellipse cx="256" cy="288" rx="28" ry="20" fill="#EE5253"/>
                        <path d="M225 315 Q256 345 287 315" stroke="#4A3B32" stroke-width="14" stroke-linecap="round" fill="none"/>
                    </svg>
                `.trim();
                const iconUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(appIconSvg);

                // Pasang Apple Touch Icon untuk perangkat iOS/iPadOS
                const appleIconEl = document.getElementById('appleTouchIcon');
                if (appleIconEl) appleIconEl.href = iconUrl;

                // 2. Buat Web App Manifest secara dinamis dalam 1 file
                const manifestData = {
                    name: 'Pustaka Belajar Alina - Sumatif 3',
                    short_name: 'Pustaka Alina',
                    description: 'Aplikasi Buku Interaktif Sumatif 3 (Al-Islam, Literasi Digital, English, PPKn)',
                    start_url: './index.html',
                    scope: './',
                    display: 'standalone',
                    orientation: 'any',
                    background_color: '#FDF6E7',
                    theme_color: '#FFD426',
                    icons: [
                        {
                            src: iconUrl,
                            sizes: '192x192',
                            type: 'image/svg+xml',
                            purpose: 'any maskable'
                        },
                        {
                            src: iconUrl,
                            sizes: '512x512',
                            type: 'image/svg+xml',
                            purpose: 'any maskable'
                        }
                    ]
                };

                const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/manifest+json' });
                const manifestUrl = URL.createObjectURL(manifestBlob);
                const manifestLink = document.getElementById('pwaManifestLink');
                if (manifestLink) manifestLink.href = manifestUrl;

                // 3. Daftarkan Inline Service Worker untuk Cache Offline
                if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
                    const swCode = `
                        const CACHE_NAME = 'pustaka-alina-sumatif3-v3';
                        const ASSETS_TO_CACHE = [
                            './',
                            './index.html',
                            './alislam-sumatif-3.html',
                            './digital-sumatif-3.html',
                            './english-sumatif-3.html',
                            './ppkn-sumatif-3.html',
                            './senirupa-sumatif-3.html',
                            './mtk-sumatif-3.html'
                        ];

                        self.addEventListener('install', (event) => {
                            event.waitUntil(
                                caches.open(CACHE_NAME).then((cache) => {
                                    return Promise.allSettled(
                                        ASSETS_TO_CACHE.map(url => cache.add(url).catch(() => null))
                                    );
                                })
                            );
                            self.skipWaiting();
                        });

                        self.addEventListener('activate', (event) => {
                            event.waitUntil(
                                caches.keys().then((keys) => Promise.all(
                                    keys.filter(key => key !== CACHE_NAME).map(key => caches.delete(key))
                                ))
                            );
                            self.clients.claim();
                        });

                        self.addEventListener('fetch', (event) => {
                            if (event.request.method !== 'GET') return;
                            event.respondWith(
                                caches.match(event.request).then((cachedResponse) => {
                                    const fetchPromise = fetch(event.request).then((networkResponse) => {
                                        if (networkResponse && networkResponse.status === 200) {
                                            const responseClone = networkResponse.clone();
                                            caches.open(CACHE_NAME).then((cache) => cache.put(event.request, responseClone));
                                        }
                                        return networkResponse;
                                    }).catch(() => cachedResponse);

                                    return cachedResponse || fetchPromise;
                                })
                            );
                        });
                    `;

                    const swBlob = new Blob([swCode], { type: 'application/javascript' });
                    const swUrl = URL.createObjectURL(swBlob);
                    navigator.serviceWorker.register(swUrl).catch(() => {
                        // Abaikan jika dijalankan langsung lewat file:// lokal tanpa server HTTP/HTTPS
                    });
                }
            } catch (err) {
                console.warn('Inisialisasi PWA dilewati:', err);
            }
        }

        // Tangkap event instalasi PWA dari browser (Chrome/Edge/Android)
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const installBtn = document.getElementById('pwaInstallBtn');
            if (installBtn) {
                installBtn.classList.remove('hidden');
                installBtn.classList.add('flex');
            }
        });

        async function installPWA() {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                const installBtn = document.getElementById('pwaInstallBtn');
                if (installBtn) installBtn.classList.add('hidden');
            }
            deferredPrompt = null;
        }

        // Jalankan saat halaman dimuat
        renderBookCards();
        setupPWA();
    </script>
